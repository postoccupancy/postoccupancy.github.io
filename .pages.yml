media: 
  input: public/images
  output: /images
content:
  - name: prototypes
    label: Prototypes
    type: collection
    path: src/content/prototypes

    fields:
      - name: title
        label: Title
        type: string
      - name: description
        type: string
      - name: date
        type: string
      - name: category
        type: string
        required: false
      - name: image
        type: image
        required: false
      - name: imageAlt
        type: string
        required: false

  - name: intro
    label: Intro
    type: file
    path: src/content/headings/intro.md
    format: yaml-frontmatter

    operations:
      delete: false

    fields:
      - name: heading
        label: Heading
        type: string
        required: true

